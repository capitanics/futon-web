services:
  db:
    image: mysql:8.4
    container_name: futon-web-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_USER: ${DATABASE_USER:-kotatsu}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME:-kotatsu_db}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - kotatsu-db:/var/lib/mysql

  syncserver:
    image: ghcr.io/kotatsuapp/kotatsu-syncserver:latest
    container_name: futon-web-sync
    restart: unless-stopped
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_DIALECT: mysql
      DATABASE_USER: ${DATABASE_USER:-kotatsu}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-kotatsu_db}
      JWT_SECRET: ${JWT_SECRET}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      ALLOW_NEW_REGISTER: ${ALLOW_NEW_REGISTER:-true}
      MAIL_PROVIDER: console
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # futon-web backend joins here in Phase 5 (built locally until then)

volumes:
  kotatsu-db:
